<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಪಾಠ ವೀಕ್ಷಣಾ ಮಾದರಿ ನಮೂನೆ - HM Lesson Observation</title>
    <style>
        @media print{
          .no-print{
            display:none !important;
          }
        }

        :root {
            --primary-color: #0f4c81;
            --secondary-color: #3b82f6;
            --accent-color: #f59e0b;
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #1e293b;
            --header-gradient: linear-gradient(135deg, #0f4c81 0%, #1d4ed8 100%);
        }

        body {
            font-family: 'Nudi 01', 'Arial', sans-serif, Kannada;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 76, 129, 0.15);
            border: 3px solid var(--primary-color);
            overflow: hidden;
        }

        /* Card Header Style */
        .card-header {
            background: var(--header-gradient);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 4px solid var(--accent-color);
        }

        .card-header h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .card-header .subtitle {
            font-size: 16px;
            color: #e0f2fe;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Card Body Style */
        .card-body {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .form-group:hover {
            border-color: var(--secondary-color);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-size: 14px;
        }

        input[type="text"], input[type="number"], select, textarea {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .inline-inputs {
            display: flex;
            gap: 10px;
        }

        .inline-inputs > div {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #dbeafe;
            color: var(--primary-color);
            font-weight: bold;
        }

        .section-title {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            margin: 25px 0 15px 0;
            font-size: 15px;
            box-shadow: 0 2px 5px rgba(16, 185, 129, 0.2);
        }

        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 45px;
            padding-top: 25px;
            border-top: 2px dashed #cbd5e1;
        }

        .signature-box {
            text-align: center;
            width: 42%;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .signature-box input {
            border: none;
            border-bottom: 2px solid var(--primary-color);
            text-align: center;
            margin-top: 30px;
            background: transparent;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
            padding: 20px;
            background: #f1f5f9;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-print {
            background-color: #10b981;
            color: white;
        }

        .btn-print:hover {
            background-color: #059669;
        }

        .btn-save {
            background-color: #3b82f6;
            color: white;
        }

        .btn-save:hover {
            background-color: #2563eb;
        }

        .btn-reset {
            background-color: #ef4444;
            color: white;
        }

        .btn-reset:hover {
            background-color: #dc2626;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                border: 2px solid #000;
                max-width: 100%;
                border-radius: 0;
            }
            .card-header {
                background: #f1f5f9 !important;
                color: #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                border-bottom: 2px solid #000;
            }
            .card-header .subtitle {
                color: #333 !important;
            }
            .section-title {
                background: #e2e8f0 !important;
                color: #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .action-buttons {
                display: none;
            }
            .form-group {
                background: transparent !important;
                border: none;
                padding: 5px 0;
            }
            input, select, textarea {
                border: none;
                border-bottom: 1px solid #000;
                border-radius: 0;
                padding: 2px 0;
                background: transparent;
            }
            textarea {
                min-height: 40px;
            }
        }
    </style>
</head>
<body>

<div class="container desktop-view-mode">
    <div class="card-header">
        <h2>ಶಾಲಾ ಮುಖ್ಯ ಗುರುಗಳಿಂದ ಶೈಕ್ಷಣಿಕ ಮೇಲ್ವಿಚಾರಣೆ</h2>
        <div class="subtitle">ಪಾಠ ವೀಕ್ಷಣಾ ಮಾದರಿ ನಮೂನೆ</div>
    </div>

    <div class="card-body">
        <form id="observationForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="schoolName">1. ಶಾಲೆಯ ಹೆಸರು:</label>
                    <input type="text" id="schoolName" name="schoolName" placeholder="ಶಾಲೆಯ ಹೆಸರನ್ನು ನಮೂದಿಸಿ">
                </div>
                <div class="form-group">
                    <label for="teacherName">2. ಶಿಕ್ಷಕರ ಹೆಸರು:</label>
                    <input type="text" id="teacherName" name="teacherName" placeholder="ಶಿಕ್ಷಕರ ಹೆಸರನ್ನು ನಮೂದಿಸಿ">
                </div>

                <div class="form-group">
                    <label>3. ತರಗತಿ ಹಾಗೂ ವಿಭಾಗ:</label>
                    <div class="inline-inputs">
                        <input type="text" id="className" name="className" placeholder="ತರಗತಿ">
                        <input type="text" id="section" name="section" placeholder="ವಿಭಾಗ">
                    </div>
                </div>

                <div class="form-group">
                    <label>4. ತರಗತಿ ವಿದ್ಯಾರ್ಥಿಗಳ ಸಂಖ್ಯೆ:</label>
                    <div class="inline-inputs">
                        <input type="text" id="enrollment" name="enrollment" placeholder="ದಾಖಲಾತಿ">
                        <input type="text" id="attendance" name="attendance" placeholder="ಹಾಜರಾತಿ">
                        <input type="text" id="percentage" name="percentage" placeholder="ಶೇಕಡಾವಾರು %">
                    </div>
                </div>

                <div class="form-group">
                    <label>5. ಬೋಧನಾ ವಿಷಯ ಹಾಗೂ ಅವಧಿ:</label>
                    <div class="inline-inputs">
                        <input type="text" id="subject" name="subject" placeholder="ವಿಷಯ">
                        <input type="text" id="period" name="period" placeholder="ಅವಧಿ">
                    </div>
                </div>

                <div class="form-group">
                    <label for="lessonName">6. ಪಾಠದ ಹೆಸರು:</label>
                    <input type="text" id="lessonName" name="lessonName" placeholder="ಪಾಠದ ಹೆಸರು">
                </div>
            </div>

            <div class="form-group full-width">
                <label for="lessonGoal">7. ಪಾಠದ ಉದ್ದೇಶಿತ ಗುರಿ ಹಾಗೂ ಕಲಿಕಾಂಶಗಳು:</label>
                <textarea id="lessonGoal" name="lessonGoal" placeholder="ಗುರಿ ಮತ್ತು ಕಲಿಕಾಂಶಗಳನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ..."></textarea>
            </div>

            <div class="form-group">
                <label for="observationTime">8. ತರಗತಿ ಬೋಧನೆ ಅವಲೋಕಿಸಿದ ಸಮಯ (ನಿಮಿಷಗಳಲ್ಲಿ):</label>
                <input type="text" id="observationTime" name="observationTime" placeholder="ಉದಾ: 45 ನಿಮಿಷಗಳು">
            </div>

            <div class="form-group full-width">
                <label for="processNotes">9. ಬೋಧನಾ ಕಲಿಕಾ ಪ್ರಕ್ರಿಯೆಯಲ್ಲಿ ಗಮನಿಸಿದ ಅಂಶಗಳು:</label>
                <textarea id="processNotes" name="processNotes" placeholder="ವಿವರಗಳನ್ನು ನಮೂದಿಸಿ..."></textarea>
            </div>

            <div class="section-title">ಪಾಠದ ಬೆಳವಣಿಗೆ</div>
            
            <div class="form-group">
                <label for="motivation">ಅಭಿಪ್ರೇರಣೆ:</label>
                <input type="text" id="motivation" name="motivation" placeholder="ಅಭಿಪ್ರೇರಣೆಯ ವಿವರ">
            </div>

            <div class="form-group full-width">
                <label>ಉದ್ದೇಶಿತ ಸಾಮರ್ಥ್ಯ ಹಾಗೂ ಕಲಿಕಾಂಶಗಳ ವಿವರ:</label>
                <table>
                    <thead>
                        <tr>
                            <th>ತರಗತಿ ಹಂತ</th>
                            <th>ಒಟ್ಟು ಸಾಮರ್ಥ್ಯಗಳು</th>
                            <th>ಸಾಧಿಸಿದ ಸಾಮರ್ಥ್ಯಗಳು</th>
                            <th>ಬಾಕಿಯಿರುವ ಸಾಮರ್ಥ್ಯಗಳು</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>ಅ) 1 - 5</td>
                            <td><input type="text" name="tot_1_5"></td>
                            <td><input type="text" name="ach_1_5"></td>
                            <td><input type="text" name="rem_1_5"></td>
                        </tr>
                        <tr>
                            <td>ಆ) 6 - 7</td>
                            <td><input type="text" name="tot_6_7"></td>
                            <td><input type="text" name="ach_6_7"></td>
                            <td><input type="text" name="rem_6_7"></td>
                        </tr>
                        <tr>
                            <td>ಇ) 8 - 10</td>
                            <td><input type="text" name="tot_8_10"></td>
                            <td><input type="text" name="ach_8_10"></td>
                            <td><input type="text" name="rem_8_10"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="supplementaryLit">ಈ) ಪೂರಕ ಸಾಹಿತ್ಯದ ಉಪಯೋಗ:</label>
                    <input type="text" id="supplementaryLit" name="supplementaryLit">
                </div>
                <div class="form-group">
                    <label for="tlmUsage">ಉ) ಪಾಠೋಪಕರಣಗಳ ಉಪಯೋಗ (TLM):</label>
                    <input type="text" id="tlmUsage" name="tlmUsage">
                </div>
                <div class="form-group">
                    <label for="blackboardUse">ಊ) ಕಪ್ಪು ಹಲಗೆಯ ಬಳಕೆ:</label>
                    <input type="text" id="blackboardUse" name="blackboardUse">
                </div>
                <div class="form-group">
                    <label for="communication">ಋ) ಪರಿಣಾಮಕಾರಿ ಸಂವಹನ:</label>
                    <input type="text" id="communication" name="communication">
                </div>
            </div>

            <div class="form-group">
                <label>ಎ) ಗೃಹ ಪಾಠ ತಿದ್ದುವಿಕೆ:</label>
                <div class="inline-inputs">
                    <input type="text" id="hwDetail" name="hwDetail" placeholder="ವಿವರ">
                    <input type="text" id="hwCount" name="hwCount" placeholder="ಸಂಖ್ಯೆ">
                </div>
            </div>

            <div class="form-group full-width">
                <label for="praisePoints">10. ಬೋಧನೆಯಲ್ಲಿನ ಪ್ರಶಂಸನೀಯ ಅಂಶಗಳು:</label>
                <textarea id="praisePoints" name="praisePoints" placeholder="ಪ್ರಶಂಸನೀಯ ಅಂಶಗಳನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ..."></textarea>
            </div>

            <div class="form-group full-width">
                <label for="suggestions">11. ಮೇಲ್ವಿಚಾರಣೆಯಲ್ಲಿ ನೀಡಿದ ಸಲಹೆಗಳು:</label>
                <textarea id="suggestions" name="suggestions" placeholder="ಸಲಹೆಗಳನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ..."></textarea>
            </div>

            <div class="signature-section">
                <div class="signature-box">
                    <label>ಶಿಕ್ಷಕರ ಸಹಿ</label>
                    <input type="text" placeholder="ಸಹಿ">
                </div>
                <div class="signature-box">
                    <label>ಶಾಲಾ ಮುಖ್ಯಸ್ಥರ ಸಹಿ</label>
                    <input type="text" placeholder="ಹೆಸರು ಮತ್ತು ಮೊಹರು">
                </div>
            </div>
        </form>
    </div>

    <div class="action-buttons">
        <button type="button" class="btn btn-save" onclick="saveData()">Save Auto</button>
        <button type="button" class="btn btn-print" onclick="window.print()">Print / PDF</button>
        <button type="button" class="btn btn-reset" onclick="resetForm()">Reset</button>
    </div>

    <div class="no-print" style="text-align:center;margin:15px 0;">
      <a href="https://bilingualmediumschools.blogspot.com/2026/04/home-page.html"
         target="_blank"
         style="display:inline-block;
                background:#1565c0;
                color:#fff;
                text-decoration:none;
                padding:10px 18px;
                border-radius:8px;
                font-weight:bold;
                font-size:16px;">
        <br> ರಚನೆ: ಮನೋಹರ್ ಆರ್‌ ಕೆ.ಜಿ.ಎಫ್<br>
        🌐 School Resource Centre – Click Here to Visit
      </a>
    </div>
</div>

<script>
    const form = document.getElementById('observationForm');

    function saveData() {
        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => {
            data[key] = value;
        });
        localStorage.setItem('hm_lesson_obs_data', JSON.stringify(data));
        alert('ಮಾಹಿತಿಯನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಉಳಿಸಲಾಗಿದೆ! (Data Saved)');
    }

    function loadData() {
        const savedData = localStorage.getItem('hm_lesson_obs_data');
        if (savedData) {
            const data = JSON.parse(savedData);
            for (const key in data) {
                if (form.elements[key]) {
                    form.elements[key].value = data[key];
                }
            }
        }
    }

    function resetForm() {
        if (confirm('ನೀವು ಎಲ್ಲಾ ಕ್ಷೇತ್ರಗಳನ್ನು ಮರುಹೊಂದಿಸಲು (Reset) ಬಯಸುವಿರಾ?')) {
            form.reset();
            localStorage.removeItem('hm_lesson_obs_data');
        }
    }

    window.onload = function() {
        loadData();
    };

    setInterval(() => {
        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => {
            data[key] = value;
        });
        localStorage.setItem('hm_lesson_obs_data', JSON.stringify(data));
    }, 30000);
</script>

</body>
</html>
